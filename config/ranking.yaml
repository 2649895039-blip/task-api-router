# Canonical aliases let a user's provider-specific model id be connected to
# the public name without requiring credentials for every catalog entry.
# 以下均为示例：本机 models.yaml 里的模型 id → 公开榜上对应模型名。
# 路由只在本机已配置的模型里选（通过这里映射到公开榜排名）。
aliases:
  claude-sonnet: [claude-sonnet-5, claude-sonnet-4.6]
  gpt-4o: [gpt-4o]
  deepseek-v4-flash: [deepseek-v4-pro]
  gpt-4o-mini: [gpt-4o]     # 示例：本机某便宜模型对应到公开榜上的 GPT-4o

# Policy: hard tasks use the highest-ranked configured model. High-volume
# tasks use a lower-cost configured model unless the user explicitly overrides.

# capabilities 里的 model 是【本机模型 id】（需在 aliases 或本机 models.yaml 里存在），
# 路由只考虑本机已配置的模型，按 rank 升序取第一个可用。以下为示例，请按你的模型改。
capabilities:
  code:
    - model: claude-sonnet
      rank: 1
    - model: gpt-4o
      rank: 2
    - model: deepseek-v4-flash
      rank: 3
    - model: gpt-4o-mini
      rank: 4
  reasoning:
    - model: claude-sonnet
      rank: 1
    - model: gpt-4o
      rank: 2
    - model: deepseek-v4-flash
      rank: 3
    - model: gpt-4o-mini
      rank: 4
  planning:
    - model: claude-sonnet
      rank: 1
    - model: gpt-4o
      rank: 2
    - model: deepseek-v4-flash
      rank: 3
  translation:
    - model: gpt-4o-mini
      rank: 1
    - model: deepseek-v4-flash
      rank: 2
  research:
    - model: gpt-4o-mini
      rank: 1
    - model: deepseek-v4-flash
      rank: 2
  bulk:
    - model: gpt-4o-mini
      rank: 1
    - model: deepseek-v4-flash
      rank: 2
  general:
    - model: gpt-4o-mini
      rank: 1
    - model: gpt-4o
      rank: 2
    - model: deepseek-v4-flash
      rank: 3
