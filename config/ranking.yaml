# ============================================================================
# 模型路由月榜（示例数据）
# ============================================================================
# ⚠️ 本文件是【模板/示例】：里面的模型名、排名、发布时间都是占位数据，用于展示格式。
#    发布前请把 version/catalog_snapshot/capabilities 替换成当月真实公开榜单数据
#    （来源见下方 sources）。模型迭代快，路由只用它做相对排序参考，不代表绝对能力。
#    客户端不会为了验证榜单而调用任何模型。
# 格式说明：
#   - catalog_snapshot: 公开榜单节选（前 N 名），catalog_count 应如实填写实际收录数
#   - aliases: 本机模型 id → 公开榜模型名（可多个）
#   - capabilities.<cap>.model: 必须同时存在于 aliases 或本机 models.yaml
# ============================================================================
version: 2026-08
published_at: 2026-08-19
last_verified: 2026-08-19
status: example
update_policy: monthly_manual_curation
sources:
  - name: Artificial Analysis Intelligence Index
    url: https://artificialanalysis.ai/evaluations/artificial-analysis-intelligence-index
    use_for: hard_reasoning_and_agentic_tasks
  - name: LMSYS Chatbot Arena
    url: https://lmarena.ai/leaderboard
    use_for: general_chat_preference
  - name: SWE-bench
    url: https://www.swebench.com/
    use_for: software_engineering

# 示例节选：真实榜单通常有几百条，这里只放前 30 名演示格式。
# catalog_count 请如实填"实际收录条数"，不要虚报整表规模。
catalog_count: 30
catalog_scope: "top_30_snapshot_of_source"
catalog_snapshot:
  - {rank: 1, model: claude-opus-5, display_name: "Claude Opus 5", source: artificial-analysis}
