# ============================================
# task-api-router 模型注册表（模板）
# ============================================
# 复制为 models.yaml 并填写你自己的模型。
# api_format: openai_compat / anthropic / gemini(规划中)
# key 通过环境变量传入，不要写死在文件里。

models:
  # ---------- DeepSeek（示例）----------
  deepseek-v4-flash:
    api_format: openai_compat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    capabilities: [code, reasoning, planning, chinese]
    cost_per_1k_in: 0.001
    cost_per_1k_out: 0.002
    speed: fast
    quality: high
    max_tokens: 8192

  # ---------- Claude（Anthropic 适配器示例）----------
  # 国内直连 api.anthropic.com 不通时，可指向中转(base_url) + 代理(proxy)。
  # 注意 api_key_envs 有顺序，会把 key 真正可用的变量放前面。
  claude-sonnet:
    api_format: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    api_key_envs: [ANTHROPIC_API_KEY, CLAUDE_API_KEY]
    capabilities: [code, reasoning, general]
    cost_per_1k_in: 0.003
    cost_per_1k_out: 0.015
    speed: medium
    quality: high
    max_tokens: 8192

# timeout（可选，默认 60 秒）：上游请求超时时间。
# 国内网络不可达的模型建议调小（如 15 秒），避免 auto 路由命中后长时间挂起。
# proxy（可选）：上游走代理，如 http://127.0.0.1:7890（被墙的中转/官方端点需要）。
